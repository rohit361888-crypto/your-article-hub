name: Publish Article Hub
on:
  push:
    branches: [main]
  workflow_dispatch:
  discussion:
    types: [created, edited, deleted, transferred, category_changed]
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
  discussions: read
  pages: write
  id-token: write
concurrency:
  group: article-hub-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - run: node build.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
